<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title" font-family="Segoe UI,Arial,sans-serif"><title id="title">Three actions, three different effects</title><defs><marker id="arrow-6cb7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6cb7ff"/></marker><marker id="arrow-f6b84a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f6b84a"/></marker><marker id="arrow-73d39b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73d39b"/></marker></defs><rect x="1" y="1" width="898" height="423" rx="16" fill="#111b23" stroke="#344651"/><text x="28" y="38" font-size="23" fill="#f6b84a" font-weight="600">Three actions, three different effects</text><rect x="30" y="77" width="840" height="80" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="49" y="108" font-size="20" fill="#f6b84a" font-weight="600">Save profile</text><text x="325" y="108" font-size="20" fill="#e4edf3" font-weight="600">DAC → Bridge library</text><text x="325" y="136" font-size="17" fill="#e4edf3" font-weight="400">Read state; do not change the DAC</text><rect x="30" y="173" width="840" height="80" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="49" y="204" font-size="20" fill="#f6b84a" font-weight="600">Apply profile</text><text x="325" y="204" font-size="20" fill="#e4edf3" font-weight="600">Bridge library → DAC</text><text x="325" y="232" font-size="17" fill="#e4edf3" font-weight="400">Target + AutoDark; volume optional</text><rect x="30" y="269" width="840" height="80" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="49" y="300" font-size="20" fill="#f6b84a" font-weight="600">Restore backup</text><text x="325" y="300" font-size="20" fill="#e4edf3" font-weight="600">JSON file → library</text><text x="325" y="328" font-size="17" fill="#e4edf3" font-weight="400">Replace library; leave DAC unchanged</text><text x="30" y="397" font-size="18" fill="#e4edf3" font-weight="400">Profiles contain no EQ, source/filter settings or Wi-Fi credentials.</text></svg>

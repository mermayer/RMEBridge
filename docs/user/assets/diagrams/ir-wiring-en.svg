<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 439" role="img" aria-labelledby="title" font-family="Segoe UI,Arial,sans-serif"><title id="title">Connect an optional IR module safely</title><defs><marker id="arrow-6cb7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6cb7ff"/></marker><marker id="arrow-f6b84a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f6b84a"/></marker><marker id="arrow-73d39b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73d39b"/></marker></defs><rect x="1" y="1" width="898" height="437" rx="16" fill="#111b23" stroke="#344651"/><text x="28" y="38" font-size="23" fill="#f6b84a" font-weight="600">Connect an optional IR module safely</text><rect x="38" y="86" width="235" height="200" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="58" y="119" font-size="22" fill="#e4edf3" font-weight="600">ESP32-S3</text><text x="58" y="164" font-size="20" fill="#6cb7ff" font-weight="600">GPIO14</text><text x="58" y="220" font-size="20" fill="#73d39b" font-weight="600">GND</text><text x="58" y="261" font-size="17" fill="#f6b84a" font-weight="600">5V / 5Vin ≠ 5V OUT</text><rect x="631" y="86" width="225" height="200" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="653" y="119" font-size="21" fill="#e4edf3" font-weight="600">IR transmitter</text><text x="653" y="163" font-size="17" fill="#e4edf3" font-weight="400">Signal (3.3 V logic)</text><text x="653" y="219" font-size="20" fill="#e4edf3" font-weight="400">GND</text><text x="653" y="262" font-size="17" fill="#e4edf3" font-weight="400">VCC: per datasheet</text><path d="M273 158 L624 158" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><text x="301" y="138" font-size="16" fill="#6cb7ff" font-weight="400">Signal, not supply current</text><path d="M273 215 L624 215" fill="none" stroke="#73d39b" stroke-width="3" marker-end="url(#arrow-73d39b)"/><text x="325" y="197" font-size="16" fill="#73d39b" font-weight="400">Common ground</text><rect x="342" y="304" width="244" height="60" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="359" y="330" font-size="17" fill="#f6b84a" font-weight="600">Correct module supply</text><text x="359" y="350" font-size="14" fill="#e4edf3" font-weight="400">3V3 only for a suitable module</text><path d="M586 334 L611 334 L611 257 L624 257" stroke="#f6b84a" stroke-width="3" fill="none" marker-end="url(#arrow-f6b84a)"/><text x="38" y="411" font-size="17" fill="#e4edf3" font-weight="400">No high-power LED directly on GPIO14. No uncontrolled second power source.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title" font-family="Segoe UI,Arial,sans-serif"><title id="title">Zielauswahl ist keine physische Umschaltung</title><defs><marker id="arrow-6cb7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6cb7ff"/></marker><marker id="arrow-f6b84a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f6b84a"/></marker><marker id="arrow-73d39b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73d39b"/></marker></defs><rect x="1" y="1" width="898" height="368" rx="16" fill="#111b23" stroke="#344651"/><text x="28" y="38" font-size="23" fill="#f6b84a" font-weight="600">Zielauswahl ist keine physische Umschaltung</text><rect x="32" y="84" width="385" height="177" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="52" y="116" font-size="23" fill="#6cb7ff" font-weight="600">A · Bearbeitungsziel</text><text x="52" y="150" font-size="20" fill="#e4edf3" font-weight="400">Line Out / Phones / IEM</text><text x="52" y="184" font-size="17" fill="#e4edf3" font-weight="400">Welche Werte siehst und änderst du?</text><text x="52" y="222" font-size="16" fill="#e4edf3" font-weight="400">Phones-Wechsel: ggf. auf −60 dB senken</text><rect x="483" y="84" width="385" height="177" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="503" y="116" font-size="23" fill="#f6b84a" font-weight="600">B · Aktiver DAC-Ausgang</text><text x="503" y="150" font-size="20" fill="#e4edf3" font-weight="400">Am DAC umschalten</text><text x="503" y="184" font-size="17" fill="#e4edf3" font-weight="400">Wo wird tatsächlich ausgegeben?</text><text x="503" y="222" font-size="16" fill="#e4edf3" font-weight="400">Separate Toggle-Funktion des DACs</text><text x="32" y="303" font-size="23" fill="#e4edf3" font-weight="600">A auswählen führt nicht automatisch B aus.</text><text x="32" y="341" font-size="18" fill="#e4edf3" font-weight="400">Ein Profil wählt ein Bearbeitungsziel. Es schaltet nicht den DAC-Ausgang um.</text></svg>

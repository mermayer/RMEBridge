<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title" font-family="Segoe UI,Arial,sans-serif"><title id="title">Die zwei USB-Buchsen</title><defs><marker id="arrow-6cb7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6cb7ff"/></marker><marker id="arrow-f6b84a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f6b84a"/></marker><marker id="arrow-73d39b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73d39b"/></marker></defs><rect x="1" y="1" width="898" height="588" rx="16" fill="#111b23" stroke="#344651"/><text x="28" y="38" font-size="23" fill="#f6b84a" font-weight="600">Die zwei USB-Buchsen</text><rect x="330" y="69" width="240" height="365" rx="10" fill="#1d443b" stroke="#719887"/><rect x="360" y="78" width="180" height="53" rx="4" fill="#262e35" stroke="#72838b"/><text x="396" y="111" font-size="20" fill="#d2ba76" font-weight="600">ANTENNE</text><rect x="364" y="158" width="173" height="111" rx="5" fill="#7e8b91" stroke="#a2b0b6"/><text x="389" y="200" font-size="23" fill="#142127" font-weight="700">ESP32-S3</text><text x="400" y="232" font-size="18" fill="#142127" font-weight="400">V1.3</text><rect x="359" y="316" width="68" height="25" rx="3" fill="#10171e" stroke="#7b8c94"/><text x="363" y="334" font-size="13" fill="#e4edf3" font-weight="400">BOOT</text><rect x="477" y="316" width="68" height="25" rx="3" fill="#10171e" stroke="#7b8c94"/><text x="481" y="334" font-size="13" fill="#e4edf3" font-weight="400">RESET</text><rect x="356" y="405" width="75" height="44" rx="6" fill="#a5b1b7" stroke="#dce5e9"/><rect x="466" y="405" width="75" height="44" rx="6" fill="#a5b1b7" stroke="#dce5e9"/><text x="37" y="170" font-size="19" fill="#e4edf3" font-weight="400">Bauteile zu dir</text><text x="37" y="196" font-size="17" fill="#e4edf3" font-weight="400">Antenne nach oben</text><text x="621" y="100" font-size="17" fill="#e4edf3" font-weight="400">Referenz: YD-ESP32-S3</text><text x="621" y="126" font-size="17" fill="#e4edf3" font-weight="400">V1.3 · 16 MB Flash</text><text x="41" y="347" font-size="20" fill="#f6b84a" font-weight="600">GPIO14</text><path d="M140 342 L319 359" fill="none" stroke="#f6b84a" stroke-width="3" marker-end="url(#arrow-f6b84a)"/><text x="41" y="374" font-size="16" fill="#e4edf3" font-weight="400">IR-Signal, 3,3-V-Logik</text><text x="620" y="349" font-size="17" fill="#e4edf3" font-weight="400">USB-OTG-Lötbrücke:</text><text x="620" y="376" font-size="19" fill="#f6b84a" font-weight="600">offen lassen (V1.3)</text><path d="M390 452 L231 499" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><path d="M504 452 L669 499" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><text x="40" y="524" font-size="21" fill="#6cb7ff" font-weight="600">USB / native USB → DAC</text><text x="532" y="524" font-size="21" fill="#6cb7ff" font-weight="600">UART / COM → PC / Netzteil</text><text x="40" y="565" font-size="17" fill="#e4edf3" font-weight="400">Schematische Buchsenzuordnung, keine maßstäbliche Bauzeichnung.</text></svg>

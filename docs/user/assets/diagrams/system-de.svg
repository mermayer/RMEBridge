<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title" font-family="Segoe UI,Arial,sans-serif"><title id="title">Steuerung und Audio bleiben getrennt</title><defs><marker id="arrow-6cb7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6cb7ff"/></marker><marker id="arrow-f6b84a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f6b84a"/></marker><marker id="arrow-73d39b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73d39b"/></marker></defs><rect x="1" y="1" width="898" height="388" rx="16" fill="#111b23" stroke="#344651"/><text x="28" y="38" font-size="23" fill="#f6b84a" font-weight="600">Steuerung und Audio bleiben getrennt</text><rect x="30" y="90" width="190" height="88" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="48" y="124" font-size="20" fill="#e4edf3" font-weight="600">Smartphone / PC</text><text x="48" y="153" font-size="15" fill="#e4edf3" font-weight="400">Browser im Heim-WLAN</text><rect x="320" y="90" width="215" height="88" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="342" y="124" font-size="22" fill="#e4edf3" font-weight="600">RME Bridge</text><text x="342" y="153" font-size="16" fill="#e4edf3" font-weight="400">Webserver + USB-Host</text><rect x="665" y="90" width="205" height="88" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="686" y="124" font-size="22" fill="#e4edf3" font-weight="600">RME ADI-2</text><text x="686" y="153" font-size="17" fill="#e4edf3" font-weight="400">MIDI Control: ON</text><path d="M220 135 L314 135" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><text x="238" y="113" font-size="15" fill="#6cb7ff" font-weight="400">WLAN</text><path d="M535 135 L659 135" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><text x="547" y="113" font-size="15" fill="#6cb7ff" font-weight="400">USB-MIDI</text><rect x="30" y="241" width="260" height="70" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="50" y="270" font-size="19" fill="#e4edf3" font-weight="600">Streamer / Audioquelle</text><text x="50" y="295" font-size="15" fill="#e4edf3" font-weight="400">Nicht durch die Bridge</text><path d="M291 273 L765 273" fill="none" stroke="#73d39b" stroke-width="3" marker-end="url(#arrow-73d39b)"/><text x="367" y="253" font-size="16" fill="#73d39b" font-weight="400">Audio: optisch / koaxial / passende Pro-Eingänge</text><path d="M766 271 L766 185" fill="none" stroke="#73d39b" stroke-width="3" marker-end="url(#arrow-73d39b)"/><path d="M535 166 L659 166" fill="none" stroke="#f6b84a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-f6b84a)"/><text x="565" y="200" font-size="16" fill="#f6b84a" font-weight="400">IR optional: Ein / Aus</text><text x="30" y="360" font-size="18" fill="#e4edf3" font-weight="400">USB-MIDI steuert Einstellungen. Es überträgt hier keine Musik.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title" font-family="Segoe UI,Arial,sans-serif"><title id="title">Setup in three clear steps</title><defs><marker id="arrow-6cb7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6cb7ff"/></marker><marker id="arrow-f6b84a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f6b84a"/></marker><marker id="arrow-73d39b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73d39b"/></marker></defs><rect x="1" y="1" width="898" height="358" rx="16" fill="#111b23" stroke="#344651"/><text x="28" y="38" font-size="23" fill="#f6b84a" font-weight="600">Setup in three clear steps</text><rect x="30" y="83" width="253" height="159" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="48" y="116" font-size="24" fill="#f6b84a" font-weight="700">1</text><text x="48" y="150" font-size="20" fill="#e4edf3" font-weight="600">Join Bridge Wi-Fi</text><text x="48" y="188" font-size="16" fill="#e4edf3" font-weight="400">RME-Bridge-…</text><text x="48" y="214" font-size="16" fill="#e4edf3" font-weight="400">Individual password</text><rect x="324" y="83" width="253" height="159" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="342" y="116" font-size="24" fill="#f6b84a" font-weight="700">2</text><text x="342" y="150" font-size="20" fill="#e4edf3" font-weight="600">Configure Wi-Fi</text><text x="342" y="188" font-size="16" fill="#e4edf3" font-weight="400">192.168.4.1/setup</text><text x="342" y="214" font-size="16" fill="#e4edf3" font-weight="400">Record home-network IP</text><rect x="618" y="83" width="253" height="159" rx="12" fill="#1d2a33" stroke="#3c5362"/><text x="636" y="116" font-size="24" fill="#f6b84a" font-weight="700">3</text><text x="636" y="150" font-size="20" fill="#e4edf3" font-weight="600">Return to home Wi-Fi</text><text x="636" y="188" font-size="16" fill="#e4edf3" font-weight="400">Change phone Wi-Fi</text><text x="636" y="214" font-size="16" fill="#e4edf3" font-weight="400">Open http://your-IP/</text><path d="M286 163 L319 163" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><path d="M580 163 L613 163" fill="none" stroke="#6cb7ff" stroke-width="3" marker-end="url(#arrow-6cb7ff)"/><text x="30" y="294" font-size="19" fill="#f6b84a" font-weight="600">192.168.4.1 belongs to setup Wi-Fi only.</text><text x="30" y="327" font-size="18" fill="#e4edf3" font-weight="400">For daily use, the browser and Bridge use your normal home network.</text></svg>
